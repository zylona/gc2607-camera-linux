name: Release GitHub installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-installer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Prepare standalone installer and checksum
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          asset="gc2607-camera-installer-${RELEASE_REF}.sh"
          sed "s/^DEFAULT_REF=\"main\"/DEFAULT_REF=\"${RELEASE_REF}\"/" \
            install-gc2607-camera.sh > "${asset}"
          chmod 0755 "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            gc2607-camera-installer-${{ github.ref_name }}.sh
            gc2607-camera-installer-${{ github.ref_name }}.sh.sha256
