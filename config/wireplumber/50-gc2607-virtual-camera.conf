# GC2607 virtual-camera desktop integration.
#
# The calibrated Intel HAL path is exported as a v4l2loopback webcam. Give only
# that node a high session priority; do not hide all raw IPU6 or libcamera
# devices globally, because that can affect unrelated camera applications.
#
# Keep in sync with scripts/install-virtual-camera-desktop.sh (which installs
# the equivalent into the per-user $XDG_CONFIG_HOME/wireplumber tree). The
# package ships this system-wide under /usr/share/wireplumber.

monitor.v4l2.rules = [
  {
    matches = [
      {
        api.v4l2.cap.driver = "v4l2 loopback"
        api.v4l2.cap.card = "GC2607 Virtual Camera"
      }
    ]
    actions = {
      update-props = {
        node.description = "GC2607 Virtual Camera"
        node.nick = "GC2607 Virtual Camera"
        priority.session = 1200
      }
    }
  }
]
